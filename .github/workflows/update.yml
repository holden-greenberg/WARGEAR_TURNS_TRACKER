name: Update WarGear Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run sync
      env:
        PLAYERS_CONFIG: ${{ secrets.PLAYERS_CONFIG }}
      run: python fetch_games.py

    - name: Commit and push dashboard
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "WarGear Bot"
        git add data/dashboard.json
        git diff --staged --quiet || git commit -m "Update dashboard data"
        git push

name: Check WarGear Turns

on:
  schedule:
    # Checks every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-turns:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run turn checker
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        PLAYERS_CONFIG: ${{ secrets.PLAYERS_CONFIG }}
      run: python fetch_games.py

    - name: Commit and push turn state
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "WarGear Turn Bot"
        git add data/last_turns.json
        git diff --staged --quiet || git commit -m "Update turn tracking state"
        git push

name: Fetch WarGear Games

on:
  schedule:
    # Runs every 15 minutes. 
    - cron: '*/15 * * * *'
  workflow_dispatch: # This allows you to click a button to run it manually

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives the action permission to save the JSON file

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Fetch game data
      # This securely passes your key (wg_ro_2ca44f97b691084ccad49dde) from the secrets we set up earlier[cite: 1]
      env:
        WARGEAR_API_KEY: ${{ secrets.WARGEAR_API_KEY }}
      run: python fetch_games.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/games.json
        # If there are no new turns, it skips committing to prevent errors
        git commit -m "Update active games data" || echo "No changes to commit"
        git push

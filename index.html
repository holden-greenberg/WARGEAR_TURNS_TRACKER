<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarGear Tracker</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; line-height: 1.5; }
        .header-panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 40px; }
        .header-col { flex: 1; }
        h2 { margin-top: 0; color: #fff; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        
        .archived { background: #1a1a1a; border-color: #2a2a2a; filter: grayscale(80%); opacity: 0.8; }
        .archived summary { font-weight: bold; cursor: pointer; padding: 10px; background: #222; border-radius: 4px; list-style: none; display: flex; justify-content: space-between; }
        .archived summary::-webkit-details-marker { display: none; }
        .archived-content { padding-top: 15px; }
        .winner-text { color: #4CAF50; font-weight: bold; }

        .player-row { padding: 4px 8px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; }
        .player-row.is-turn { background: #3a2a00; border-left: 3px solid #ffaa00; color: #ffcc55; font-weight: bold; }
        .player-row.eliminated { text-decoration: line-through; opacity: 0.5; color: #ff5555; }
        
        .play-btn { display: block; text-align: center; background: #238636; color: white; text-decoration: none; padding: 8px; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        .tag { background: #ffaa00; color: #000; padding: 2px 6px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚔️ WarGear Command</h1>
    
    <div class="header-panel">
        <div class="header-col">
            <h2>🚨 On The Clock</h2>
            <ul id="active-turns-list" style="margin:0; padding-left:20px; color:#ffcc55;">Loading...</ul>
        </div>
        <div class="header-col">
            <h2>🏆 Leaderboard (Tracker Era)</h2>
            <ul id="leaderboard-list" style="margin:0; padding-left:20px; color:#4CAF50;">Loading...</ul>
        </div>
    </div>

    <h2 style="border:none;">Live Games</h2>
    <div class="grid" id="live-grid"></div>

    <h2 style="border:none; margin-top:40px;">Archive</h2>
    <div style="display:flex; flex-direction:column; gap:10px;" id="archive-grid"></div>

    <script>
        async function loadDashboard() {
            try {
                const res = await fetch('data/dashboard.json?_=' + Date.now());
                const games = (await res.json()).games || [];
                
                let activeTurnsCount = {};
                let winCount = {};
                let liveHtml = '';
                let archiveHtml = '';

                games.forEach(game => {
                    const isFinished = game.gamestatus === 'Finished';
                    
                    // SAFELY EXTRACT TURNS: Filters out the 'null' entries from the WarGear API
                    let activeTurnNames = Array.isArray(game.current_turn) 
                        ? game.current_turn.filter(p => p !== null).map(p => typeof p === 'object' ? p.name : p) 
                        : [];
                    
                    // Tally Active Turns
                    if (!isFinished) {
                        activeTurnNames.forEach(name => {
                            activeTurnsCount[name] = (activeTurnsCount[name] || 0) + 1;
                        });
                    }

                    // Tally Wins
                    if (isFinished && Array.isArray(game.winners)) {
                        game.winners.filter(w => w !== null).forEach(w => {
                            winCount[w] = (winCount[w] || 0) + 1;
                        });
                    }

                    // Build Roster
                    let players = game.players ? Object.values(game.players).filter(p => p && p.name).sort((a, b) => a.seat - b.seat) : [];
                    let rosterHtml = players.map(p => {
                        let classes = 'player-row' + (activeTurnNames.includes(p.name) ? ' is-turn' : '') + (['Eliminated', 'Booted', 'Surrendered'].includes(p.status) ? ' eliminated' : '');
                        return `<div class="${classes}"><span>${p.seat}. ${p.name}</span><span>${p.status}</span></div>`;
                    }).join('');

                    const cardInner = `
                        <div class="meta-info" style="color:#aaa; font-size:0.85rem; margin-bottom:10px;">Status: ${game.gamestatus} | Map: ${game.boardname}</div>
                        <strong>Roster:</strong>
                        <div style="margin-top:5px;">${rosterHtml}</div>
                        <a href="https://www.wargear.net/games/player/${game.gameid}" class="play-btn" target="_blank">View Game</a>
                    `;

                    if (isFinished) {
                        // SAFELY EXTRACT WINNERS: Handles both arrays and plain text strings
                        let winnerText = 'Unknown';
                        if (Array.isArray(game.winners)) {
                            winnerText = game.winners.filter(w => w !== null).join(', ') || 'Unknown';
                        } else if (game.winners) {
                            winnerText = game.winners;
                        }

                        archiveHtml += `
                            <details class="card archived">
                                <summary>
                                    <span>${game.name}</span>
                                    <span class="winner-text">Winner: ${winnerText} 🏆</span>
                                </summary>
                                <div class="archived-content">${cardInner}</div>
                            </details>
                        `;
                    } else {
                        liveHtml += `<div class="card"><div style="font-size:1.2rem; font-weight:bold; color:#fff; margin-bottom:5px;">${game.name}</div>${cardInner}</div>`;
                    }
                });

                document.getElementById('live-grid').innerHTML = liveHtml || '<p>No live games.</p>';
                document.getElementById('archive-grid').innerHTML = archiveHtml || '<p>No archived games yet.</p>';
                
                // Render Top Panels
                document.getElementById('active-turns-list').innerHTML = Object.entries(activeTurnsCount).length ? 
                    Object.entries(activeTurnsCount).sort((a,b) => b[1]-a[1]).map(([name, count]) => `<li><strong>${name}</strong> <span class="tag">${count} turns</span></li>`).join('') : '<li>All quiet.</li>';
                
                document.getElementById('leaderboard-list').innerHTML = Object.entries(winCount).length ? 
                    Object.entries(winCount).sort((a,b) => b[1]-a[1]).map(([name, count]) => `<li><strong>${name}</strong>: ${count} win${count > 1 ? 's' : ''}</li>`).join('') : '<li>No wins yet.</li>';

            } catch (err) { 
                console.error("Error details:", err); 
                document.getElementById('live-grid').innerHTML = '<p style="color:#ff5555;">Could not load game data. Check the console for details.</p>';
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarGear Tracker</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 15px; line-height: 1.5; margin: 0; }
        
        /* Mobile-Responsive Header Panel */
        .header-panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
        .header-col { flex: 1 1 280px; min-width: 0; }
        h1 { font-size: 1.5rem; margin-top: 5px; }
        h2 { margin-top: 0; color: #fff; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        /* Mobile-Responsive Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        
        .archived { background: #1a1a1a; border-color: #2a2a2a; filter: grayscale(80%); opacity: 0.8; }
        .archived summary { font-weight: bold; cursor: pointer; padding: 10px; background: #222; border-radius: 4px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        .archived summary::-webkit-details-marker { display: none; }
        .archived-content { padding-top: 15px; }
        .winner-text { color: #4CAF50; font-weight: bold; font-size: 0.9rem; }

        .player-row { padding: 6px 8px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; font-size: 0.95rem; }
        .player-row.is-turn { background: #3a2a00; border-left: 3px solid #ffaa00; color: #ffcc55; font-weight: bold; }
        .player-row.eliminated { text-decoration: line-through; opacity: 0.5; color: #ff5555; }
        
        .play-btn { display: block; text-align: center; background: #238636; color: white; text-decoration: none; padding: 10px; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        .tag { background: #ffaa00; color: #000; padding: 2px 6px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; float: right; }
        .clock-games { color: #aaa; font-size: 0.8rem; margin: 2px 0 0 0; font-weight: normal; }
        .clock-games .overdue { color: #ff6b6b; }

        ul { padding-left: 0; list-style-type: none; margin: 0; }
        li { padding: 4px 0; border-bottom: 1px dashed #333; }
        li:last-child { border-bottom: none; }

        .stats-wrap { overflow-x: auto; }
        table.stats-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
        table.stats-table th, table.stats-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #2a2a2a; }
        table.stats-table th:first-child, table.stats-table td:first-child { text-align: left; }
        table.stats-table th { color: #aaa; font-weight: normal; cursor: pointer; user-select: none; position: sticky; top: 0; background: #1e1e1e; }
        table.stats-table th:hover { color: #fff; }
        table.stats-table th.sorted { color: #ffcc55; }
        table.stats-table tbody tr:hover { background: #232323; }
        table.stats-table td.name-cell { font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <h1>⚔️ WarGear Command</h1>
    
    <div class="header-panel">
        <div class="header-col">
            <h2>🚨 On The Clock</h2>
            <ul id="active-turns-list" style="color:#ffcc55;">Loading...</ul>
        </div>
    </div>

    <h2 style="border:none;">📊 Player Stats (Tracker Era)</h2>
    <div class="card stats-wrap" style="margin-bottom:30px;">
        <table class="stats-table" id="stats-table">
            <thead>
                <tr>
                    <th data-key="name" data-type="string">Player</th>
                    <th data-key="elo" data-type="number">Elo</th>
                    <th data-key="wins" data-type="number">Wins</th>
                    <th data-key="winRate" data-type="number">Win %</th>
                    <th data-key="gamesPlayed" data-type="number">Games</th>
                    <th data-key="avgSurvival" data-type="number">Avg Survival</th>
                    <th data-key="eliminationsPerGame" data-type="number">Elims / Game</th>
                    <th data-key="avgTurnSeconds" data-type="number">Avg Turn Time</th>
                </tr>
            </thead>
            <tbody id="stats-tbody"><tr><td colspan="8">Loading...</td></tr></tbody>
        </table>
    </div>

    <h2 style="border:none;">Live Games</h2>
    <div class="grid" id="live-grid"></div>

    <h2 style="border:none; margin-top:40px;">Archive</h2>
    <div style="display:flex; flex-direction:column; gap:10px;" id="archive-grid"></div>

    <script>
        // Set the official start date of the Tracker Era (September 2, 2026)
        // This converts the date into a Unix timestamp to match the WarGear API format
        const TRACKER_ERA_START = new Date("2026-09-02T00:00:00").getTime() / 1000;

        // Formats a countdown in seconds as "1d 4h", "5h 12m", "42m", etc.
        function formatTimeLeft(seconds) {
            if (seconds <= 0) return 'Overdue';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}d ${h}h left`;
            if (h > 0) return `${h}h ${m}m left`;
            return `${m}m left`;
        }

        // Formats an average turn duration in seconds as "2h 15m", "45m", etc.
        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return '—';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}d ${h}h`;
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        let statsRows = [];
        let sortState = { key: 'elo', dir: -1 };

        // Multiplayer Elo: every finished game is decomposed into pairwise
        // matchups between its players, ranked winner-first then by how many
        // turns each eliminated player survived. Ratings update per pair
        // using the standard Elo expectation, un-normalized by player count -
        // so an 8-player FFA (7 pairwise results) moves a rating far more
        // than a 3-player game (2 pairwise results), and beating a
        // higher-rated opponent earns more than beating a lower-rated one.
        const ELO_BASE = 1500;
        const ELO_K = 20;

        function computePlayerElo(finishedGames) {
            const ratings = {};
            const gamesForElo = [...finishedGames].sort((a, b) => (a.endstamp || 0) - (b.endstamp || 0));

            gamesForElo.forEach(game => {
                const players = game.players ? Object.values(game.players).filter(p => p && p.name) : [];
                if (players.length < 2) return;

                const winners = new Set(Array.isArray(game.winners) ? game.winners.filter(w => w !== null) : []);
                const ranked = players.map(p => ({
                    name: p.name,
                    tier: winners.has(p.name) ? 1 : 0,
                    survival: typeof p.turn_counter === 'number' ? p.turn_counter : -1
                }));

                ranked.forEach(p => { if (!(p.name in ratings)) ratings[p.name] = ELO_BASE; });
                const deltas = {};
                ranked.forEach(p => { deltas[p.name] = 0; });

                for (let i = 0; i < ranked.length; i++) {
                    for (let j = i + 1; j < ranked.length; j++) {
                        const a = ranked[i], b = ranked[j];
                        let scoreA;
                        if (a.tier !== b.tier) scoreA = a.tier > b.tier ? 1 : 0;
                        else if (a.survival !== b.survival) scoreA = a.survival > b.survival ? 1 : 0;
                        else scoreA = 0.5;
                        const scoreB = 1 - scoreA;

                        const ratingA = ratings[a.name], ratingB = ratings[b.name];
                        const expectedA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
                        const expectedB = 1 - expectedA;

                        deltas[a.name] += ELO_K * (scoreA - expectedA);
                        deltas[b.name] += ELO_K * (scoreB - expectedB);
                    }
                }

                Object.keys(deltas).forEach(name => { ratings[name] += deltas[name]; });
            });

            return ratings;
        }

        // Green (best) to red (worst), scaled across the players currently in the table.
        function eloColor(elo, min, max) {
            if (elo === null || elo === undefined || min === max) return '';
            const t = Math.max(0, Math.min(1, (elo - min) / (max - min)));
            const hue = t * 120;
            return `background: hsla(${hue}, 65%, 32%, 0.6); color: #fff;`;
        }

        function renderStatsTable() {
            const tbody = document.getElementById('stats-tbody');
            const { key, dir } = sortState;
            const sorted = [...statsRows].sort((a, b) => {
                const av = a[key], bv = b[key];
                if (typeof av === 'string') return dir * av.localeCompare(bv);
                return dir * ((av ?? -Infinity) - (bv ?? -Infinity));
            });

            const playedElos = statsRows.filter(r => r.gamesPlayed).map(r => r.elo);
            const minElo = playedElos.length ? Math.min(...playedElos) : 0;
            const maxElo = playedElos.length ? Math.max(...playedElos) : 0;

            tbody.innerHTML = sorted.length ? sorted.map(r => `
                <tr>
                    <td class="name-cell">${r.name}</td>
                    <td style="${r.gamesPlayed ? eloColor(r.elo, minElo, maxElo) : ''}">${r.gamesPlayed ? Math.round(r.elo) : '—'}</td>
                    <td>${r.wins}</td>
                    <td>${r.gamesPlayed ? Math.round(r.winRate * 100) + '%' : '—'}</td>
                    <td>${r.gamesPlayed}</td>
                    <td>${r.avgSurvival !== null ? r.avgSurvival.toFixed(1) + ' turns' : '—'}</td>
                    <td>${r.gamesPlayed ? r.eliminationsPerGame.toFixed(2) : '—'}</td>
                    <td>${r.avgTurnSeconds !== null ? formatDuration(r.avgTurnSeconds) : '—'}</td>
                </tr>
            `).join('') : '<tr><td colspan="8" style="color:#aaa;">No player stats recorded yet.</td></tr>';

            document.querySelectorAll('#stats-table th').forEach(th => {
                th.classList.toggle('sorted', th.dataset.key === key);
            });
        }

        document.querySelectorAll('#stats-table th').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.key;
                if (sortState.key === key) {
                    sortState.dir *= -1;
                } else {
                    sortState = { key, dir: th.dataset.type === 'string' ? 1 : -1 };
                }
                renderStatsTable();
            });
        });

        async function loadDashboard() {
            try {
                const [dashRes, turnStatsRes] = await Promise.all([
                    fetch('data/dashboard.json?_=' + Date.now()),
                    fetch('data/turn_stats.json?_=' + Date.now())
                ]);
                const allGames = (await dashRes.json()).games || [];
                const turnStats = turnStatsRes.ok ? (await turnStatsRes.json()).players || {} : {};

                let activeTurnsGames = {};
                let winCount = {};
                let gamesPlayedCount = {};
                let survivalTurns = {};
                let eliminationCount = {};
                const nowSeconds = Date.now() / 1000;
                let liveHtml = '';
                let archiveHtml = '';

                // Filter out any game that finished before the Tracker Era started
                const validGames = allGames.filter(game => {
                    const isFinished = game.gamestatus === 'Finished';
                    if (isFinished && (game.endstamp < TRACKER_ERA_START || !game.endstamp)) {
                        return false; 
                    }
                    return true;
                });

                validGames.forEach(game => {
                    // Check if the game status is marked as Finished by the API
                    const isFinished = game.gamestatus === 'Finished';
                    
                    // SAFELY EXTRACT TURNS: Filters out 'null' entries
                    let activeTurnNames = Array.isArray(game.current_turn) 
                        ? game.current_turn.filter(p => p !== null).map(p => typeof p === 'object' ? p.name : p) 
                        : [];
                    
                    // Tally Active Turns (Only for live games)
                    if (!isFinished) {
                        // Prefer a live countdown from turnstamp + boot_time; fall back to the
                        // API's last-fetched time_remaining snapshot if either field is missing.
                        let secondsLeft = null;
                        if (typeof game.turnstamp === 'number' && typeof game.boot_time === 'number') {
                            secondsLeft = game.boot_time - (nowSeconds - game.turnstamp);
                        } else if (typeof game.time_remaining === 'number') {
                            secondsLeft = game.time_remaining;
                        }

                        activeTurnNames.forEach(name => {
                            if (!activeTurnsGames[name]) activeTurnsGames[name] = [];
                            activeTurnsGames[name].push({ gameName: game.name, secondsLeft });
                        });
                    }

                    // Tally Wins (Only for Tracker Era finished games)
                    if (isFinished && Array.isArray(game.winners)) {
                        game.winners.filter(w => w !== null).forEach(w => {
                            winCount[w] = (winCount[w] || 0) + 1;
                        });
                    }

                    // Build Roster
                    let players = game.players ? Object.values(game.players).filter(p => p && p.name).sort((a, b) => a.seat - b.seat) : [];
                    let seatToName = {};
                    players.forEach(p => { seatToName[p.seat] = p.name; });

                    // All player stats (games played, survival, eliminations) are
                    // Tracker Era finished games only - live games can still flip.
                    if (isFinished) {
                        players.forEach(p => {
                            gamesPlayedCount[p.name] = (gamesPlayedCount[p.name] || 0) + 1;

                            let isEliminated = ['Eliminated', 'Booted', 'Surrendered'].includes(p.status) || !!p.eliminated_by;
                            if (isEliminated && typeof p.turn_counter === 'number') {
                                if (!survivalTurns[p.name]) survivalTurns[p.name] = [];
                                survivalTurns[p.name].push(p.turn_counter);
                            }
                            if (p.eliminated_by && seatToName[p.eliminated_by] && seatToName[p.eliminated_by] !== p.name) {
                                const killer = seatToName[p.eliminated_by];
                                eliminationCount[killer] = (eliminationCount[killer] || 0) + 1;
                            }
                        });
                    }

                    let rosterHtml = players.map(p => {
                        let isEliminated = ['Eliminated', 'Booted', 'Surrendered'].includes(p.status) || !!p.eliminated_by;
                        let displayStatus = isEliminated ? 'Eliminated' : 'Alive';
                        let classes = 'player-row' + (activeTurnNames.includes(p.name) ? ' is-turn' : '') + (isEliminated ? ' eliminated' : '');
                        return `<div class="${classes}"><span>${p.seat}. ${p.name}</span><span>${displayStatus}</span></div>`;
                    }).join('');

                    const cardInner = `
                        <div style="color:#aaa; font-size:0.85rem; margin-bottom:10px;">Status: ${game.gamestatus} | Map: ${game.boardname}</div>
                        <strong>Roster:</strong>
                        <div style="margin-top:5px; border-top: 1px solid #2a2a2a;">${rosterHtml}</div>
                        <a href="https://www.wargear.net/games/player/${game.gameid}" class="play-btn" target="_blank">View Game</a>
                    `;

                    if (isFinished) {
                        // SAFELY EXTRACT WINNERS
                        let winnerText = 'Unknown';
                        if (Array.isArray(game.winners)) {
                            winnerText = game.winners.filter(w => w !== null).join(', ') || 'Unknown';
                        } else if (game.winners) {
                            winnerText = game.winners;
                        }

                        archiveHtml += `
                            <details class="card archived">
                                <summary>
                                    <span>${game.name}</span>
                                    <span class="winner-text">Winner: ${winnerText} 🏆</span>
                                </summary>
                                <div class="archived-content">${cardInner}</div>
                            </details>
                        `;
                    } else {
                        liveHtml += `<div class="card"><div style="font-size:1.2rem; font-weight:bold; color:#fff; margin-bottom:5px;">${game.name}</div>${cardInner}</div>`;
                    }
                });

                document.getElementById('live-grid').innerHTML = liveHtml || '<p style="color:#aaa;">No live games currently active.</p>';
                document.getElementById('archive-grid').innerHTML = archiveHtml || '<p style="color:#aaa;">No Tracker Era games have finished yet. Play on!</p>';
                
                // Render Top Panels
                document.getElementById('active-turns-list').innerHTML = Object.entries(activeTurnsGames).length ?
                    Object.entries(activeTurnsGames).sort((a,b) => b[1].length-a[1].length).map(([name, games]) => {
                        const gamesHtml = games.map(g => {
                            const timeText = g.secondsLeft === null ? '' : ` — ${formatTimeLeft(g.secondsLeft)}`;
                            const overdueClass = g.secondsLeft !== null && g.secondsLeft <= 0 ? ' class="overdue"' : '';
                            return `<div${overdueClass}>${g.gameName}${timeText}</div>`;
                        }).join('');
                        return `<li><strong>${name}</strong> <span class="tag">${games.length}</span><div class="clock-games">${gamesHtml}</div></li>`;
                    }).join('') : '<li style="color:#aaa;">All quiet. No active turns.</li>';
                
                // Build the combined per-player stats table
                const eloRatings = computePlayerElo(validGames.filter(g => g.gamestatus === 'Finished'));

                let allNames = new Set([
                    ...Object.keys(winCount),
                    ...Object.keys(gamesPlayedCount),
                    ...Object.keys(survivalTurns),
                    ...Object.keys(eliminationCount),
                    ...Object.keys(turnStats),
                    ...Object.keys(eloRatings)
                ]);

                statsRows = Array.from(allNames).map(name => {
                    const wins = winCount[name] || 0;
                    const gamesPlayed = gamesPlayedCount[name] || 0;
                    const eliminations = eliminationCount[name] || 0;
                    const survivals = survivalTurns[name] || [];
                    const avgSurvival = survivals.length ? survivals.reduce((a, b) => a + b, 0) / survivals.length : null;
                    const ts = turnStats[name];
                    const avgTurnSeconds = ts && ts.turns ? ts.total_seconds / ts.turns : null;

                    return {
                        name,
                        elo: eloRatings[name] ?? ELO_BASE,
                        wins,
                        gamesPlayed,
                        winRate: gamesPlayed ? wins / gamesPlayed : 0,
                        avgSurvival,
                        eliminations,
                        eliminationsPerGame: gamesPlayed ? eliminations / gamesPlayed : 0,
                        avgTurnSeconds
                    };
                });

                renderStatsTable();

            } catch (err) {
                console.error("Error details:", err); 
                document.getElementById('live-grid').innerHTML = '<p style="color:#ff5555;">Could not load game data. Check the console for details.</p>';
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarGear Simple Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; line-height: 1.5; }
        .header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        .game-title { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .meta-info { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; }
        
        .player-list { list-style-type: none; padding: 0; margin: 0; font-size: 0.9rem; }
        .player-row { padding: 4px 8px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; }
        .player-row.is-turn { background: #3a2a00; border-left: 3px solid #ffaa00; font-weight: bold; color: #ffcc55; }
        .player-row.eliminated { text-decoration: line-through; opacity: 0.5; color: #ff5555; }
        
        .timer-box { background: #2a2a2a; padding: 10px; border-radius: 4px; margin-top: 15px; font-size: 0.85rem; }
        .timer-warning { color: #ff5555; font-weight: bold; }
        
        a.play-btn { display: block; text-align: center; background: #238636; color: white; text-decoration: none; padding: 8px; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        a.play-btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="header">
        <h1>WarGear Active Games</h1>
        <div id="sync-info" style="color:#aaa; font-size:0.9rem;">Loading data...</div>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        // Helper to format seconds into hours and minutes
        function formatTime(seconds) {
            if (seconds < 0) return "0h 0m";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}h ${m}m`;
        }

        async function loadDashboard() {
            try {
                const res = await fetch('data/dashboard.json?_=' + Date.now());
                const payload = await res.json();
                const games = payload.games || [];
                
                document.getElementById('sync-info').textContent = `Tracking ${games.length} active games.`;
                const grid = document.getElementById('grid');
                let html = '';

                games.forEach(game => {
                    // 1. Calculate overall game duration
                    const now = Math.floor(Date.now() / 1000);
                    const gameElapsedDays = Math.floor((now - game.startstamp) / 86400);

                    // 2. Identify active turn players
                    let activeTurnNames = [];
                    if (Array.isArray(game.current_turn)) {
                        activeTurnNames = game.current_turn.map(p => typeof p === 'object' ? p.name : p);
                    }

                    // 3. Process turn timers
                    const turnElapsedSec = now - game.turnstamp;
                    const timeLeftSec = game.boot_time - turnElapsedSec;
                    const isWarning = timeLeftSec > 0 && timeLeftSec < 3600; // less than 1 hour left

                    // 4. Sort players by seat to show strict turn order
                    let players = [];
                    if (game.players) {
                        players = Object.values(game.players).filter(p => p && p.name);
                        players.sort((a, b) => a.seat - b.seat);
                    }

                    // Build the player list HTML
                    let rosterHtml = '';
                    players.forEach(p => {
                        const isTurn = activeTurnNames.includes(p.name);
                        const isDead = ['Eliminated', 'Booted', 'Surrendered', 'Terminated'].includes(p.status);
                        
                        let classes = 'player-row';
                        if (isTurn) classes += ' is-turn';
                        if (isDead) classes += ' eliminated';

                        rosterHtml += `
                            <li class="${classes}">
                                <span>${p.seat}. ${p.name}</span>
                                <span>${p.status}</span>
                            </li>
                        `;
                    });

                    // Build the card HTML
                    html += `
                        <div class="card">
                            <div class="game-title">${game.name}</div>
                            <div class="meta-info">
                                Game running for: ${gameElapsedDays} days<br>
                                Status: ${game.gamestatus}
                            </div>
                            
                            <strong>Turn Order:</strong>
                            <ul class="player-list">
                                ${rosterHtml}
                            </ul>

                            <div class="timer-box">
                                <div><strong>Current Turn Duration:</strong> ${formatTime(turnElapsedSec)}</div>
                                <div class="${isWarning ? 'timer-warning' : ''}"><strong>Time Until Boot:</strong> ${formatTime(timeLeftSec)}</div>
                            </div>

                            <a href="https://www.wargear.net/games/player/${game.gameid}" class="play-btn" target="_blank">Open Game</a>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            } catch (err) {
                document.getElementById('grid').innerHTML = `<p style="color:#ff5555;">Could not load game data. Ensure GitHub Actions has run.</p>`;
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 60000); // Auto-refresh every minute
    </script>
</body>
</html>
